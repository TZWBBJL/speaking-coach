<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f6f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>开口练 · 30 天口语训练</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#23271f; --muted:#727768; --line:#e7e1d3;
  --green:#2f6f5e; --green-2:#3f8a72; --green-soft:#e8f1ec;
  --amber:#b8792f; --amber-soft:#f8eee0; --red:#b4483c; --blue:#3a6ea5;
  --radius:20px; --shadow:0 1px 2px rgba(40,45,35,.05),0 8px 24px rgba(40,45,35,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.phone{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- top ---------- */
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 20px 10px;
  background:linear-gradient(var(--bg) 72%,rgba(246,243,236,0));
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.5px;font-size:17px}
.brand .mark{width:26px;height:26px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:13px}
.daychip{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:4px 11px;border-radius:999px}

/* ---------- view ---------- */
.view{flex:1;padding:6px 16px 108px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:14px 16px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec-title h2{font-size:15px;font-weight:700;letter-spacing:.3px}
.sec-title span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.center{text-align:center}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 18px;color:#fff;
  background:linear-gradient(140deg,#2c6a59 0%,#347a65 55%,#4a8f77 100%);
  box-shadow:0 14px 34px rgba(47,111,94,.28);margin-bottom:16px;
}
.hero:after{content:"";position:absolute;right:-46px;top:-58px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{content:"";position:absolute;right:26px;bottom:-70px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .kicker{font-size:12px;letter-spacing:2px;opacity:.75;text-transform:uppercase}
.hero h1{font-size:25px;line-height:1.35;margin:7px 0 8px;font-weight:700;letter-spacing:.5px}
.hero .goal{font-size:13.5px;opacity:.86;line-height:1.6;max-width:88%}
.hero .meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
.hero .cta{
  margin-top:18px;width:100%;background:#fff;color:var(--green);font-weight:700;border-radius:15px;
  padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;
  transition:transform .12s;
}
.hero .cta:active{transform:scale(.985)}
.hero .progressline{margin-top:16px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.hero .progressline i{display:block;height:100%;background:#f3e3b8;border-radius:99px;transition:width .5s}
.hero .progtext{display:flex;justify-content:space-between;font-size:11.5px;opacity:.75;margin-top:7px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;padding:12px 18px;font-weight:600;font-size:15px;transition:transform .12s,background .2s;border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(47,111,94,.22)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.block{width:100%}
.btn.danger{background:#fbeeec;color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- stats / rows ---------- */
.statrow{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);margin-top:2px}
.dnum{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--green-soft);color:var(--green)}
.dnum.done{background:var(--green);color:#fff}
.dnum.lock{background:#efece3;color:#a5a99b}

/* ---------- course ---------- */
.mod{margin-bottom:16px}
.modhead{display:flex;align-items:center;gap:11px;padding:6px 4px 10px}
.modhead .bar{width:4px;height:30px;border-radius:4px;background:var(--green)}
.modhead h3{font-size:16px;font-weight:700}
.modhead p{font-size:12px;color:var(--muted)}
.modhead .range{margin-left:auto;font-size:11px;color:var(--muted)}
.lessons{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 14px;box-shadow:var(--shadow)}
.lessons .row{cursor:pointer}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#f1eee5;color:var(--muted);margin-left:6px;vertical-align:1px}
.score-mini{font-size:12px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}

/* ---------- session ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideup .3s cubic-bezier(.22,.9,.3,1)}
.overlay[hidden]{display:none}
@keyframes slideup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sess{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.sesshead{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.sesshead .grow{flex:1}
.sesshead .step{font-size:11.5px;color:var(--muted);letter-spacing:1px}
.sesshead .ttl{font-size:15px;font-weight:700}
.steps{display:flex;gap:5px;margin-bottom:18px}
.steps i{height:3px;flex:1;border-radius:99px;background:#e3ddd0}
.steps i.on{background:var(--green)}

.sess h2.big{font-size:22px;line-height:1.4;letter-spacing:.4px;margin-bottom:8px}
.goalbox{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:18px}
.skillbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.skillbox h4{font-size:12px;letter-spacing:1.5px;color:var(--green);margin-bottom:8px;font-weight:700}
.skillbox ul{margin:0;padding-left:18px}
.skillbox li{font-size:14px;line-height:1.75;margin-bottom:2px}
.phrase{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#4c5346;padding:7px 0;border-bottom:1px dashed var(--line)}
.phrase:last-child{border-bottom:0}
.phrase b{color:var(--green);font-weight:700}
.taskbox{background:#fff;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.75;margin-bottom:14px}
.taskbox .lb{font-size:11px;letter-spacing:1.5px;color:var(--amber);font-weight:700;margin-bottom:4px}
details.hint{background:#fbf8f0;border:1px dashed #ddd3bd;border-radius:13px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;color:#5d6257}
details.hint summary{font-weight:600;color:var(--amber);cursor:pointer;list-style:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint p{margin:7px 0 0;line-height:1.7}
.demo{font-size:14px;line-height:1.85;color:#41473c;background:var(--green-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.demo .lb{font-size:11px;letter-spacing:1.5px;color:var(--green);font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.speakbtn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--green);background:#fff;border-radius:99px;padding:3px 9px;font-weight:600}

.sessfoot{margin-top:auto;padding-top:20px}

/* timer */
.timerwrap{text-align:center;padding:22px 0 10px}
.timer{font-size:56px;font-weight:200;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.over{color:var(--amber)}
.timersub{font-size:12.5px;color:var(--muted);letter-spacing:.5px}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 0 10px}
.recbtn{width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(47,111,94,.1),0 10px 26px rgba(47,111,94,.3);transition:all .2s}
.recbtn.stop{background:#b4483c;box-shadow:0 0 0 10px rgba(180,72,60,.1),0 10px 26px rgba(180,72,60,.3)}
.recbtn svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.recbtn .dot{width:26px;height:26px;border-radius:7px;background:#fff}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 8px rgba(180,72,60,.12)}50%{box-shadow:0 0 0 18px rgba(180,72,60,.03)}}
.live{min-height:78px;max-height:150px;overflow-y:auto;font-size:14.5px;line-height:1.8;color:#4c5346;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.live:empty:before{content:"开始说话后，这里会出现实时文字……";color:#a8ac9f}
.live .interim{color:#a8ac9f}
.bartarget{height:4px;background:#e3ddd0;border-radius:99px;overflow:hidden;width:100%;margin-top:4px}
.bartarget i{display:block;height:100%;background:var(--green);width:0;transition:width .2s linear}

/* result */
.scorewrap{display:flex;align-items:center;gap:18px;margin:6px 0 16px}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring .num{position:relative;z-index:1;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .num small{font-size:11px;font-weight:500;color:var(--muted)}
.scoretxt h3{font-size:19px;margin-bottom:3px}
.scoretxt p{font-size:13px;color:var(--muted);line-height:1.6}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.metric .k{font-size:11.5px;color:var(--muted)}
.metric .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
.metric .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.metric .c{font-size:11px;margin-top:2px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipx{font-size:12.5px;padding:5px 10px;border-radius:9px;background:#f1eee5;color:#8b8f80}
.chipx.hit{background:var(--green-soft);color:var(--green);font-weight:600}
.chipx.miss{background:#fbeeec;color:#b46a5e}
.transcript{font-size:14px;line-height:1.85;color:#454b3f;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;max-height:190px;overflow-y:auto;white-space:pre-wrap}
.selfrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.selfrow:last-child{border-bottom:0}
.selfrow .lb{font-size:14px}
.stars{display:flex;gap:5px}
.star{width:28px;height:28px;border-radius:9px;background:#f1eee5;display:grid;place-items:center;font-size:12px;color:#a5a99b;font-weight:600}
.star.on{background:var(--green);color:#fff}
textarea.note{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 13px;font-family:inherit;font-size:14px;line-height:1.7;color:var(--ink);outline:none}
textarea.note:focus{border-color:#bcd3c8}
.selfnote{font-size:11.5px;color:var(--muted);margin-top:5px}

/* records */
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:92px;padding:6px 2px 0}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barcol .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:#dfe9e3;min-height:3px;transition:height .5s}
.barcol .bar.has{background:var(--green-2)}
.barcol .d{font-size:10.5px;color:var(--muted)}
.rec{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .sc{width:42px;height:42px;border-radius:13px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.rec .sc.low{background:var(--amber-soft);color:var(--amber)}
.rec .info{flex:1;min-width:0}
.rec .info b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .info span{font-size:11.5px;color:var(--muted)}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:14px}
.empty .ico{font-size:34px;margin-bottom:8px;opacity:.5}

/* guide */
.guide h3{font-size:15px;margin-bottom:8px}
.guide p,.guide li{font-size:14px;line-height:1.85;color:#454b3f}
.guide ol,.guide ul{padding-left:20px;margin:6px 0}
.guide .kbd{font-family:ui-monospace,monospace;background:#f1eee5;border-radius:5px;padding:1px 5px;font-size:12.5px}
.callout{background:var(--amber-soft);border-radius:12px;padding:11px 14px;font-size:12.5px;color:#7a5a2c;line-height:1.7;margin-top:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);background:rgba(30,38,30,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:82%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  max-width:560px;margin:0 auto;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(246,243,236,0),rgba(246,243,236,.92) 34%,var(--bg));
}
.tabbar a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 4px;font-size:10.5px;color:#989d90;border-radius:14px;transition:color .2s}
.tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--green);font-weight:600}
.tabbar a.on svg{stroke-width:2}

@media (min-width:600px){
  body{background:#ece8de}
  .phone{border-left:1px solid #e2dccd;border-right:1px solid #e2dccd;box-shadow:0 0 60px rgba(0,0,0,.05)}
}

</style>
</head>
<body>
<div class="phone">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 12.5 12 5l8 7.5"/><path d="M6.5 11v8h11v-8"/></svg><span>今天</span></a>
    <a href="#course" data-tab="course"><svg viewBox="0 0 24 24"><path d="M4 5.5h6a2 2 0 0 1 2 2V19a2 2 0 0 0-2-2H4z"/><path d="M20 5.5h-6a2 2 0 0 0-2 2V19a2 2 0 0 1 2-2h6z"/></svg><span>课程</span></a>
    <a href="#records" data-tab="records"><svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg><span>记录</span></a>
    <a href="#guide" data-tab="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 7.8v.2"/></svg><span>指南</span></a>
  </nav>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast"></div>
<script>
/* 30 天口语训练课程数据 */
window.MODULES = [
  { id: 1, title: '说清楚', sub: '敢开口，把一件事讲明白', color: '#2f6f5e', range: '第 1–8 天' },
  { id: 2, title: '问到位', sub: '会提问，把需求问准确', color: '#3a6ea5', range: '第 9–15 天' },
  { id: 3, title: '讲重点', sub: '会汇报，结论先行', color: '#a2622f', range: '第 16–23 天' },
  { id: 4, title: '拿结果', sub: '会沟通，推动事情发生', color: '#8a4b6b', range: '第 24–30 天' }
];

window.WARMUPS = [
  { name: '开口热身', text: '红鲤鱼与绿鲤鱼与驴，红鲤鱼与绿鲤鱼与驴。', tip: '慢一点，每个字咬清楚，连续三遍。' },
  { name: '唇舌热身', text: '八百标兵奔北坡，炮兵并排北边跑。', tip: '嘴唇用力，不要含糊带过。' },
  { name: '气息热身', text: '（深吸气）数枣：一个枣、两个枣、三个枣……一口气数到二十。', tip: '用肚子吸气，声音落在气息上。' },
  { name: '语速热身', text: '四是四，十是十，十四是十四，四十是四十。', tip: '先慢后快，快而不乱。' },
  { name: '咬字热身', text: '黑化肥发灰会挥发，灰化肥挥发会发黑。', tip: '每个"发"都要送气。' },
  { name: '音量热身', text: '“大家好，我今天想讲三件事。”', tip: '用会议室最后一排能听清的音量说三遍。' },
  { name: '表情热身', text: '微笑着说出：“这个想法很有意思，我想多听你说两句。”', tip: '嘴角先起来，声音会跟着变暖。' },
  { name: '停顿热身', text: '“这件事（停一秒）我有一个不同的看法（停一秒）想和大家讨论。”', tip: '停顿是自信，不是忘词。' }
];

window.LESSONS = [
  {
    day: 1, title: '30 秒自我介绍', tag: '破冰',
    goal: '让对方在 30 秒内记住：你是谁、在做什么、今天为什么在这儿。',
    skill: [
      '一句话身份：姓名 + 角色/负责的事',
      '一句话价值：你帮谁解决什么问题',
      '一句话钩子：今天来的目的或想认识的人'
    ],
    phrases: ['我是……，在……负责……', '简单说，我的工作是帮……', '今天来，主要是想……'],

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------------- top / router ---------------- */
  function renderTop(active) {
    var done = Object.keys(doneDays()).length;
    topbar.innerHTML =
      '<div class="brand"><span class="mark">口</span>开口练</div>' +
      '<div class="daychip">' + (done ? '已练 ' + done + ' / 30 天' : '30 天 · 每天 10 分钟') + '</div>';

      a.classList.toggle('on', a.getAttribute('data-tab') === active);

  function hideOverlay() {
    overlay.hidden = true; overlay.innerHTML = '';
  }
  function go(h) {
    if (('#' + h) === location.hash) route();
    else location.hash = h;
  }

  function route() {
    var h = (location.hash || '#today').replace(/^#/, '');
    if (h.indexOf('session/') === 0) {
      var day = parseInt(h.split('/')[1], 10) || 1;
      if (!SS || SS.day !== day) startSession(day);
      else { overlay.hidden = false; renderSession(); }
      return;
    }
    if (SS) { cleanupSession(); SS = null; }
    if (h.indexOf('record/') === 0) { openRecord(h.slice(7)); return; }
    hideOverlay();
    var tab = ['today', 'course', 'records', 'guide'].indexOf(h) >= 0 ? h : 'today';
    lastTab = tab;
    renderTop(tab);
    if (tab === 'today') renderToday();
    else if (tab === 'course') renderCourse();
    else if (tab === 'records') renderRecords();
    else renderGuide();
  }
  window.addEventListener('hashchange', route);

  /* ---------------- course ---------------- */
  function renderCourse() {
    var done = doneDays();
    var html = '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:6px 4px 14px">' +
      '<div><h2 style="font-size:20px">30 天课程</h2><div class="tiny muted" style="margin-top:2px">由易到难，每天一节，每节 10 分钟</div></div>' +
      '<button class="btn soft" style="padding:8px 12px;font-size:13px" data-act="random">随机抽一节</button></div>';

    MODULES.forEach(function (m) {
      var ls = LESSONS.filter(function (l) {
        return (m.id === 1 && l.day <= 8) || (m.id === 2 && l.day >= 9 && l.day <= 15) ||
               (m.id === 3 && l.day >= 16 && l.day <= 23) || (m.id === 4 && l.day >= 24);
      });
      var c = ls.filter(function (l) { return done[l.day]; }).length;
      html += '<div class="mod"><div class="modhead">' +
        '<div class="bar" style="background:' + m.color + '"></div>' +
        '<div><h3>' + esc(m.title) + '</h3><p>' + esc(m.sub) + '</p></div>' +
        '<div class="range">' + c + '/' + ls.length + '</div></div>' +
        '<div class="lessons">';
      ls.forEach(function (l) {
        var recs = S.records.filter(function (r) { return r.day === l.day; });
        var best = recs.length ? Math.max.apply(null, recs.map(function (r) { return r.score || 0; })) : 0;
        html += '<a class="row" href="#session/' + l.day + '">' +
          '<div class="dnum ' + (done[l.day] ? 'done' : '') + '">' + (done[l.day] ? '✓' : pad(l.day)) + '</div>' +
          '<div class="grow"><div class="t">' + esc(l.title) + '<span class="tag">' + esc(l.tag) + '</span></div>' +
          '<div class="s">' + l.speak + ' 秒 · ' + esc(l.goal.slice(0, 22)) + '…</div></div>' +
          (done[l.day] ? '<div class="score-mini">' + best + '</div>' : '<div style="color:#c3c7bb">›</div>') +
          '</a>';
      });
      html += '</div></div>';
    });
    view.innerHTML = html;
  }

  /* ---------------- records ---------------- */
  function renderRecords() {
    var rs = S.records;
    var days = {}; rs.forEach(function (r) { days[r.date] = true; });
    var totalMin = Math.round(rs.reduce(function (a, r) { return a + (r.dur || 0); }, 0) / 60);
    var avg = rs.length ? Math.round(rs.reduce(function (a, r) { return a + (r.score || 0); }, 0) / rs.length) : 0;

    var html = '<div style="margin:6px 4px 14px"><h2 style="font-size:20px">练习记录</h2>' +
      '<div class="tiny muted" style="margin-top:2px">回听比多练更重要</div></div>' +
      '<div class="statrow" style="margin-bottom:10px">' +
      '<div class="stat"><b>' + Object.keys(days).length + '</b><span>打卡天数</span></div>' +
      '<div class="stat"><b>' + streak() + '</b><span>连续天数</span></div>' +
      '<div class="stat"><b>' + rs.length + '</b><span>练习次数</span></div>' +
      '<div class="stat"><b>' + avg + '</b><span>平均分</span></div></div>';

    // 7 天柱状
    var bars = '', max = 1, data = [];
    for (var i = 6; i >= 0; i--) {
      var dt = new Date(Date.now() - i * 864e5), ds = dateStr(dt);
      var sec = rs.filter(function (r) { return r.date === ds; }).reduce(function (a, r) { return a + (r.dur || 0); }, 0);
      data.push({ ds: ds, sec: sec, label: ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()] });
      if (sec > max) max = sec;
    }
    data.forEach(function (d) {
      var h = d.sec ? Math.max(6, Math.round(d.sec / max * 70)) : 3;
      bars += '<div class="barcol"><div class="bar ' + (d.sec ? 'has' : '') + '" style="height:' + h + 'px"></div><div class="d">' + d.label + '</div></div>';
    });
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
      '<b style="font-size:14px">最近 7 天</b><span class="tiny muted">累计 ' + Math.round(rs.filter(function (r) {
        return r.ts > Date.now() - 7 * 864e5;
      }).reduce(function (a, r) { return a + (r.dur || 0); }, 0) / 60) + ' 分钟</span></div>' +
      '<div class="bars">' + bars + '</div></div>';

    if (!rs.length) {
      html += '<div class="empty"><div class="ico">◌</div>还没有记录<br><span class="tiny">完成第一次练习后，这里会留下你的声音和分数</span></div>';
    } else {
      html += '<div class="sec-title"><h2>最近练习</h2><span>点开可看转写与复盘</span></div><div class="card" style="padding:4px 16px">';
      rs.slice(0, 30).forEach(function (r) {
        var sc = r.score == null ? '—' : r.score;
        html += '<div class="rec" data-act="open-rec" data-id="' + r.id + '" style="cursor:pointer">' +
          '<div class="sc ' + ((r.score || 0) < 60 ? 'low' : '') + '">' + sc + '</div>' +
          '<div class="info"><b>' + esc(r.title) + '</b><span>' + r.date.slice(5) + ' · 第 ' + r.day + ' 天 · ' + mmss(r.dur) + ' · ' + (r.chars || 0) + ' 字</span></div>' +
          '<div style="color:#c3c7bb">›</div></div>';
      });
      html += '</div>';
    }
    view.innerHTML = html;
  }

  /* ---------------- session ---------------- */
  function startSession(day) {
    var L = lessonOf(day);
    if (!L) { location.hash = '#course'; return; }
    if (SS) cleanupSession();
    SS = {
      day: day, lesson: L, step: 'brief', phase: 'idle',
      text: '', finalText: '', interim: '', dur: 0, result: null,
      self: { goal: 0, structure: 0, fluent: 0, natural: 0 },
      note: '', audioUrl: null, recActive: false, returnTab: lastTab
    };
    overlay.hidden = false;
    renderSession();
    window.scrollTo(0, 0);
  }

  function cleanupSession() {
    stopTimers();
    stopMic();
    if (SS && SS.audioUrl) { try { URL.revokeObjectURL(SS.audioUrl); } catch (e) {} }
    if (window.speechSynthesis && window.speechSynthesis.cancel) window.speechSynthesis.cancel();
  }

  function closeSession() {
    cleanupSession();
    var back = (SS && SS.returnTab) || lastTab || 'today';
    SS = null;
    hideOverlay();
    go(back);
  }

  function stopTimers() {
    if (!SS) return;
    if (SS.timer) { clearInterval(SS.timer); SS.timer = null; }
    if (SS.prepTimer) { clearInterval(SS.prepTimer); SS.prepTimer = null; }
  }

  function headHTML(stepIdx) {
    var L = SS.lesson;
    return '<div class="sess"><div class="sesshead">' +
      '<button class="iconbtn" data-act="close" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<div class="grow"><div class="step">第 ' + SS.day + ' 天 · ' + esc(L.tag) + '</div>' +
      '<div class="ttl">' + esc(L.title) + '</div></div>' +
      '<div class="tiny muted">' + (stepIdx + 1) + '/3</div></div>' +
      '<div class="steps">' + [0, 1, 2].map(function (i) {
        return '<i class="' + (i <= stepIdx ? 'on' : '') + '"></i>';
      }).join('') + '</div>';
  }

  function renderSession() {
    if (!SS) return;
    var L = SS.lesson, html = '';
    if (SS.step === 'brief') html = briefHTML(L);
    else if (SS.step === 'speak') html = speakHTML(L);
    else html = resultHTML(L);
    overlay.innerHTML = html;
    overlay.scrollTop = 0;
    if (SS.step === 'result') bindResult();
  }

  function briefHTML(L) {
    return headHTML(0) +
      '<h2 class="big">' + esc(L.title) + '</h2>' +
      '<div class="goalbox">' + esc(L.goal) + '</div>' +

      '<div class="skillbox"><h4>这一节练什么</h4><ul>' +
      L.skill.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>' +

      '<div class="skillbox"><h4>可以直接用的句式</h4>' +
      L.phrases.map(function (p) {
        var parts = p.split('：');
        return '<div class="phrase"><b>' + (parts.length > 1 ? esc(parts[0]) + '：' : '·') + '</b><span>' + esc(parts.length > 1 ? parts.slice(1).join('：') : p) + '</span></div>';
      }).join('') + '</div>' +

      '<div class="taskbox"><div class="lb">今天的题目</div>' + esc(L.task) + '</div>' +

      '<details class="hint"><summary>卡住了？看 2 条提示</summary>' +
      L.hints.map(function (h) { return '<p>· ' + esc(h) + '</p>'; }).join('') + '</details>' +

      '<details class="hint"><summary>想先听一遍示范？</summary>' +
      '<div class="demo" style="margin-top:9px;background:#fff"><div class="lb">示范答案（不要背，学结构）' +
      '<button class="speakbtn" data-act="demo">▶ 听</button></div>' + esc(L.demo) + '</div></details>' +

      '<div class="sessfoot"><button class="btn primary block" data-act="to-speak">准备好了，开始 →</button>' +
      '<div class="center tiny muted" style="margin-top:10px">准备 ' + L.prep + ' 秒 · 开口 ' + L.speak + ' 秒</div></div>' +
      '</div>';
  }

  function speakHTML(L) {
    var body;
    if (SS.phase === 'prep') {
      body = '<div class="timerwrap"><div class="timer" id="timer">' + mmss(SS.prepLeft || L.prep) + '</div>' +
        '<div class="timersub">准备时间 · 想好第一句，别写稿</div></div>' +
        '<div class="taskbox"><div class="lb">题目</div>' + esc(L.task) + '</div>' +
        '<details class="hint" open><summary>三个关键词（说出来就算达标）</summary>' +
        L.must.map(function (g) { return '<p>· ' + esc(g[0]) + '</p>'; }).join('') + '</details>' +
        '<div class="sessfoot"><button class="btn primary block" data-act="skip-prep">不等了，直接开始说</button></div>';
    } else if (SS.phase === 'ready') {
      body = '<div class="timerwrap"><div class="timer" id="timer">' + mmss(L.speak) + '</div>' +
        '<div class="timersub">目标时长 · 说满它，卡住也别停</div></div>' +
        '<div class="taskbox"><div class="lb">题目</div>' + esc(L.task) + '</div>' +
        '<div class="sessfoot"><button class="btn primary block" data-act="start-speak">🎙 开始说（点一下开始计时）</button>' +
        '<div class="center" style="margin-top:12px"><button class="tiny muted" data-act="textmode" style="text-decoration:underline">没有麦克风？直接进入文字分析</button></div>' +
        '<div class="center tiny muted" style="margin-top:6px">' + (hasSR() ? '会实时转写成文字，结束后自动分析' : '当前浏览器不支持实时转写，会录音供你回听') + '</div></div>';
    } else if (SS.phase === 'recording') {
      body = '<div class="timerwrap"><div class="timer" id="timer">00:00</div>' +
        '<div class="timersub" id="timersub">目标 ' + mmss(L.speak) + ' · 正在录</div>' +
        '<div class="bartarget" style="margin-top:12px"><i id="bar"></i></div></div>' +
        '<div class="live" id="live"></div>' +
        '<div class="recwrap"><button class="recbtn stop pulse" data-act="stop-speak" aria-label="结束">' +
        '<span class="dot"></span></button>' +
        '<div class="tiny muted">说完了点方块 · 最长 ' + mmss(Math.round(L.speak * 1.8)) + ' 自动结束</div></div>' +
        '<div class="sessfoot"></div>';
    } else {
      body = '';
    }
    return headHTML(1) + body + '</div>';
  }

  function resultHTML(L) {
    var R = SS.result;
    if (!R) return headHTML(2) + '<div class="empty">没有数据</div></div>';
    var score = R.score;
    var deg = score == null ? 0 : score;
    var color = score == null ? '#c9c4b6' : (score >= 85 ? '#2f6f5e' : score >= 70 ? '#3f8a72' : score >= 55 ? '#b8792f' : '#b4483c');
    var html = headHTML(2) +
      '<div class="scorewrap">' +
      '<div class="ring" style="background:conic-gradient(' + color + ' ' + (deg * 3.6) + 'deg,#eee9dd 0)">' +
      '<div class="num" style="color:' + color + '">' + (score == null ? '—' : score) + '<small>' + (score == null ? '' : ' 分') + '</small></div></div>' +
      '<div class="scoretxt"><h3>' + (R.grade || '未分析') + '</h3><p>' + esc(R.advice || '') + '</p></div></div>' +

      (R.chars === 0 && R.dur > 0 ? '<div class="card tight" style="background:#fbeeec;border-color:#efd3ce"><div class="tiny" style="color:#8a5a50;line-height:1.7"><b>没有识别到文字。</b>可能是麦克风未授权，或浏览器不支持转写。你仍然可以回听录音，也可以在下面手动补上你说的内容再分析。</div></div>' : '') +

      '<div class="metrics">' +
      metric('开口时长', R.dur ? mmss(R.dur) : '—', '目标 ' + L.speak + ' 秒') +
      metric('语速', R.speed || '—', '字/分钟', speedComment(R.speed)) +
      metric('口头禅', R.fillerTotal + ' 次', R.fillerTotal > 0 ? '每百字 ' + (R.chars ? (R.fillerTotal / R.chars * 100).toFixed(1) : 0) + ' 次' : '很干净') +
      metric('关键信息', R.hitCount + ' / ' + L.must.length, R.hitCount === L.must.length ? '都说到了' : '还差 ' + (L.must.length - R.hitCount) + ' 项') +
      '</div>' +

      '<div class="card tight"><div class="tiny muted" style="margin-bottom:8px">关键信息覆盖</div><div class="chips">' +
      L.must.map(function (g, i) {
        return '<span class="chipx ' + (R.hits[i] ? 'hit' : 'miss') + '">' + (R.hits[i] ? '✓ ' : '· ') + esc(g[0]) + '</span>';
      }).join('') + '</div>' +
      '<div class="tiny muted" style="margin:14px 0 8px">结构信号</div><div class="chips">' +
      [['开头', R.struct[0]], ['分点', R.struct[1]], ['收尾', R.struct[2]]].map(function (x) {
        return '<span class="chipx ' + (x[1] ? 'hit' : '') + '">' + (x[1] ? '✓ ' : '· ') + x[0] + '</span>';
      }).join('') + '</div>' +
      (R.fillerList.length ? '<div class="tiny muted" style="margin:14px 0 8px">出现最多的口头禅</div><div class="chips">' +
        R.fillerList.slice(0, 5).map(function (f) { return '<span class="chipx miss">' + esc(f[0]) + ' ×' + f[1] + '</span>'; }).join('') + '</div>' : '') +
      '</div>' +

      '<div id="audioSlot">' + (SS.audioUrl ? '<div class="card tight"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:13px">回听录音</b><audio controls src="' + SS.audioUrl + '" style="flex:1;height:36px"></audio></div><div class="tiny muted" style="margin-top:6px">只听两件事：开头是否啰嗦、有没有"嗯/那个"。</div></div>' : '') + '</div>' +

      '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:13px">你的转写</b><span class="tiny muted">' + R.chars + ' 字</span></div>' +
      '<div class="transcript">' + (SS.text ? esc(SS.text) : '<span class="muted">（空）</span>') + '</div>' +
      '<details class="hint" style="margin:10px 0 0"><summary>转写不准？手动修改</summary>' +
      '<textarea class="note" id="manualText" style="margin-top:9px" placeholder="把你说的话打出来或粘贴进来，再点重新分析">' + esc(SS.text) + '</textarea>' +
      '<button class="btn soft" style="margin-top:8px;width:100%" data-act="reanalyze">用这段文字重新分析</button></details></div>' +

      '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><b style="font-size:13px">给自己打分</b><span class="tiny muted">1 = 差，5 = 好</span></div>' +
      selfRow('goal', '目标达成', '题目要求的信息说全了吗') +
      selfRow('structure', '结构清楚', '开头、分点、收尾清楚吗') +
      selfRow('fluent', '表达流畅', '停顿和口头禅多不多') +
      selfRow('natural', '状态自然', '像平时说话，不像背稿') +
      '<textarea class="note" id="note" style="margin-top:12px" placeholder="写一句复盘：今天最大的问题是什么？下次只改一个点。">' + esc(SS.note) + '</textarea>' +
      '<div class="selfnote">这句话会存进记录，下次练之前先看一眼。</div></div>' +

      '<div class="sessfoot">' +
      '<button class="btn primary block" data-act="save">保存并打卡</button>' +
      '<div style="display:flex;gap:9px;margin-top:9px">' +
      '<button class="btn ghost" style="flex:1" data-act="again">再练一次</button>' +
      '<button class="btn ghost" style="flex:1" data-act="close">先不保存</button></div></div>' +
      '</div>';
    return html;
  }

  function metric(k, v, unit, comment) {
    return '<div class="metric"><div class="k">' + k + '</div><div class="v">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      (comment ? '<div class="c">' + esc(comment) + '</div>' : '') + '</div>';
  }
  function selfRow(key, label, desc) {
    var n = SS.self[key] || 0;
    return '<div class="selfrow"><div><div class="lb">' + label + '</div><div class="tiny muted" style="font-size:11px">' + desc + '</div></div>' +
      '<div class="stars">' + [1, 2, 3, 4, 5].map(function (i) {
        return '<button class="star ' + (i <= n ? 'on' : '') + '" data-act="rate" data-dim="' + key + '" data-val="' + i + '">' + i + '</button>';
      }).join('') + '</div></div>';
  }
  function speedComment(sp) {
    if (!sp) return '未识别到语音';
    if (sp < 90) return '偏慢，可能停顿多';
    if (sp < 150) return '略慢，可以更连贯';
    if (sp <= 300) return '很舒服的节奏';
    if (sp <= 340) return '略快，注意停顿';
    return '太快了，听的人会累';
  }

  /* ---------------- analysis ---------------- */
  var FILLERS = ['嗯', '呃', '额', '那个', '就是说', '然后呢', '其实', '反正', '基本上', '怎么说呢', '你知道'];
  var ST_OPEN = ['先说结论', '结论是', '我的观点', '我认为', '我想讲', '今天想', '我汇报', '我想请你', '简单说', '我理解', '听起来', '有个', '谢谢', '各位'];
  var ST_POINT = ['第一', '第二', '第三', '首先', '其次', '最后', '一是', '二是', '三点'];
  var ST_CLOSE = ['所以', '因此', '总结', '以上', '下一步', '建议', '希望', '谢谢'];

  function hasSR() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function analyze(text, dur, L) {
    var clean = text.replace(/[\s，。！？、；：""''（）()《》…—\-,.!?;:]/g, '');
    var chars = clean.length;
    var speed = dur > 0 ? Math.round(chars / (dur / 60)) : 0;
    var fl = {}, total = 0;
    FILLERS.forEach(function (f) {
      var c = (text.split(f).length - 1);
      if (c > 0) { fl[f] = c; total += c; }
    });
    var fillerList = Object.keys(fl).sort(function (a, b) { return fl[b] - fl[a]; }).map(function (k) { return [k, fl[k]]; });
    var hits = L.must.map(function (g) {
      return g.some(function (k) { return text.indexOf(k) >= 0; });
    });
    var hitCount = hits.filter(Boolean).length;
    var struct = [ST_OPEN.some(function (k) { return text.indexOf(k) >= 0; }) ? 1 : 0,
                  ST_POINT.some(function (k) { return text.indexOf(k) >= 0; }) ? 1 : 0,
                  ST_CLOSE.some(function (k) { return text.indexOf(k) >= 0; }) ? 1 : 0];

    var score = null, grade = '再练一次', advice = '点下面的「手动修改转写」，把你说的话补进来，才能算分。';
    if (chars >= 10 && dur > 0) {
      var ratio = dur / L.speak;
      var sDur = ratio < 0.75 ? Math.max(4, 25 * ratio / 0.75)
        : ratio <= 1.35 ? 25 : Math.max(12, 25 - (ratio - 1.35) * 12);

      var sSpeed;
      if (speed >= 150 && speed <= 300) sSpeed = 20;
      else if (speed >= 120 && speed < 150) sSpeed = 15;
      else if (speed > 300 && speed <= 340) sSpeed = 15;
      else if (speed >= 90) sSpeed = 9;
      else sSpeed = 5;

      var rate = chars ? total / chars * 100 : 0;
      var sFill = rate <= 1.5 ? 15 : rate <= 3 ? 12 : rate <= 5 ? 8 : rate <= 8 ? 4 : 2;

      var sKey = hitCount / L.must.length * 25;
      var sStruct = (struct[0] + struct[1] + struct[2]) * 5;

      score = Math.max(0, Math.min(100, Math.round(sDur + sSpeed + sFill + sKey + sStruct)));
      grade = score >= 85 ? '很稳，可以加难度了' : score >= 70 ? '达标，继续保持' : score >= 55 ? '及格线，再抠一个点' : '再来一次，先别急';

      var issues = [];
      if (sKey < 16) issues.push('关键信息漏了 ' + (L.must.length - hitCount) + ' 项，对照题目补全');
      if (sDur < 16) issues.push('只说了 ' + Math.round(ratio * 100) + '% 的时长，内容没展开');
      if (rate > 4) issues.push('口头禅 ' + total + ' 次，用停顿代替"嗯/那个"');
      if (speed > 340) issues.push('语速偏快，重点句后面停一秒');
      if (speed > 0 && speed < 150) issues.push('语速偏慢，先把结构想好再开口');
      if (sStruct <= 5) issues.push('结构感弱，用"我先说结论 + 第一/第二/最后"撑起来');
      advice = issues.length ? issues.slice(0, 2).join('；') + '。' : '节奏和信息都不错，下次试着说得更短。';
    }

    return {
      chars: chars, speed: speed, dur: dur, fillerTotal: total, fillerList: fillerList,
      hits: hits, hitCount: hitCount, struct: struct.map(Boolean), score: score, grade: grade, advice: advice
    };
  }

  /* ---------------- mic ---------------- */
  var recog = null, mediaRec = null, chunks = [], stream = null;

  function startMic() {
    // 录音（用于回听）
    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
          if (!SS || SS.phase !== 'recording') { st.getTracks().forEach(function (t) { t.stop(); }); return; }
          stream = st;
          try {
            mediaRec = new MediaRecorder(st);
            chunks = [];
            mediaRec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
            mediaRec.onstop = function () {
              if (!chunks.length || !SS) return;
              var blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
              SS.audioUrl = URL.createObjectURL(blob);
              var slot = document.getElementById('audioSlot');
              if (slot) {
                slot.innerHTML = '<div class="card tight"><div style="display:flex;align-items:center;gap:10px">' +
                  '<b style="font-size:13px">回听录音</b><audio controls src="' + SS.audioUrl + '" style="flex:1;height:36px"></audio></div>' +
                  '<div class="tiny muted" style="margin-top:6px">只听两件事：开头是否啰嗦、有没有"嗯/那个"。</div></div>';
              }
            };
            mediaRec.start();
          } catch (e) {}
        }).catch(function () { /* 没有麦克风权限也不影响计时 */ });
      }
    } catch (e) {}

    // 实时转写
    if (!hasSR()) return;
    try {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recog = new SR();
      recog.lang = 'zh-CN';
      recog.continuous = true;
      recog.interimResults = true;
      recog.onresult = function (e) {
        var interim = '';
        for (var i = e.resultIndex; i < e.results.length; i++) {
          var r = e.results[i];
          if (r.isFinal) SS.finalText += r[0].transcript;
          else interim += r[0].transcript;
        }
        SS.interim = interim;
        SS.text = (SS.finalText + interim).trim();
        var live = $('#live');
        if (live) {
          live.innerHTML = esc(SS.finalText) + (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
          live.scrollTop = live.scrollHeight;
        }
      };
      recog.onerror = function (e) {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          SS.recActive = false;
          toast('麦克风未授权：仍可计时和录音，结束后手动输入文字');
        } else if (e.error === 'network') {
          SS.recActive = false;
          toast('语音识别服务连不上：可以先用录音+手动转写');
        }
      };
      recog.onend = function () {
        if (SS && SS.recActive) { try { recog.start(); } catch (e) {} }
      };
      recog.start();
    } catch (e) {}
  }

  function stopMic() {
    if (SS) SS.recActive = false;
    if (recog) { try { recog.onend = null; recog.stop(); } catch (e) {} recog = null; }
    if (mediaRec && mediaRec.state !== 'inactive') { try { mediaRec.stop(); } catch (e) {} }
    mediaRec = null;
    if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; }
  }

  /* ---------------- session flow ---------------- */
  function toSpeak() {
    SS.step = 'speak';
    SS.phase = 'prep';
    SS.prepLeft = SS.lesson.prep;
    renderSession();
    startPrepTimer();
  }

  function startPrepTimer() {
    stopTimers();
    SS.prepTimer = setInterval(function () {
      SS.prepLeft--;
      var el = $('#timer');
      if (el) el.textContent = mmss(SS.prepLeft);
      if (SS.prepLeft <= 0) {
        clearInterval(SS.prepTimer); SS.prepTimer = null;
        SS.phase = 'ready';
        renderSession();
      }
    }, 1000);
  }

  function startSpeak() {
    var L = SS.lesson;
    SS.step = 'speak'; SS.phase = 'recording';
    SS.text = ''; SS.finalText = ''; SS.interim = '';
    SS.startTs = Date.now();
    SS.dur = 0;
    renderSession();
    SS.recActive = true;
    startMic();
    var maxSec = Math.round(L.speak * 1.8);
    SS.timer = setInterval(function () {
      var el = $('#timer'), bar = $('#bar');
      SS.dur = (Date.now() - SS.startTs) / 1000;
      if (el) {
        el.textContent = mmss(SS.dur);
        el.classList.toggle('over', SS.dur > L.speak);
      }
      if (bar) bar.style.width = Math.min(100, SS.dur / L.speak * 100) + '%';
      if (SS.dur >= maxSec) stopSpeak();
    }, 200);
  }

  function stopSpeak() {
    if (!SS || SS.phase !== 'recording') return;
    SS.dur = Math.min((Date.now() - SS.startTs) / 1000, SS.lesson.speak * 2);
    SS.phase = 'result';
    SS.step = 'result';
    stopTimers();
    SS.recActive = false;
    stopMic();
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    SS.result = analyze(SS.text, SS.dur, SS.lesson);
    renderSession();
  }

  function reanalyze() {
    var ta = $('#manualText');
    if (ta) SS.text = ta.value.trim();
    if (!SS.dur && SS.text) {
      SS.dur = Math.max(10, Math.round(SS.text.replace(/\s/g, '').length / 3.2));
    }
    SS.result = analyze(SS.text, SS.dur, SS.lesson);
    var note = $('#note'); if (note) SS.note = note.value;
    renderSession();
    toast('已重新分析');
  }

  function bindResult() {
    var note = $('#note');
    if (note) note.addEventListener('input', function () { SS.note = note.value; });
    var mt = $('#manualText');
    if (mt) mt.addEventListener('input', function () { /* 保存到 SS 由 reanalyze 处理 */ });
  }

  function saveRecord() {
    var R = SS.result;
    if (!R) return;
    var noteEl = $('#note'); if (noteEl) SS.note = noteEl.value;
    var rec = {
      id: 'r' + Date.now() + Math.floor(Math.random() * 1000),
      day: SS.day, title: SS.lesson.title, date: todayStr(), ts: Date.now(),
      dur: Math.round(SS.dur * 10) / 10, chars: R.chars, speed: R.speed,
      fillerTotal: R.fillerTotal, fillerList: R.fillerList,
      hits: R.hits, hitCount: R.hitCount, struct: R.struct,
      score: R.score, self: SS.self, note: SS.note, transcript: SS.text
    };
    S.records.unshift(rec);
    save();
    toast(rec.score == null ? '已打卡（未评分）' : '已打卡 · ' + rec.score + ' 分');
    var back = SS.returnTab || lastTab || 'today';
    cleanupSession();
    SS = null;
    hideOverlay();
    go(back);
  }

  /* ---------------- record detail ---------------- */
  function openRecord(id) {
    var r = S.records.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    var L = lessonOf(r.day) || { must: [] };
    var color = (r.score || 0) >= 85 ? '#2f6f5e' : (r.score || 0) >= 70 ? '#3f8a72' : (r.score || 0) >= 55 ? '#b8792f' : '#b4483c';
    overlay.hidden = false;
    overlay.innerHTML = '<div class="sess">' +
      '<div class="sesshead"><button class="iconbtn" data-act="close-rec"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<div class="grow"><div class="step">' + r.date + ' · 第 ' + r.day + ' 天</div><div class="ttl">' + esc(r.title) + '</div></div></div>' +
      '<div class="scorewrap"><div class="ring" style="background:conic-gradient(' + color + ' ' + ((r.score || 0) * 3.6) + 'deg,#eee9dd 0)">' +
      '<div class="num" style="color:' + color + '">' + (r.score == null ? '—' : r.score) + '<small>' + (r.score == null ? '' : ' 分') + '</small></div></div>' +
      '<div class="scoretxt"><h3>' + (r.note ? '你的复盘' : '这次练习') + '</h3><p>' + esc(r.note || '没有写复盘。下次留一句：只改一个点。') + '</p></div></div>' +
      '<div class="metrics">' +
      metric('开口时长', mmss(r.dur), '目标 ' + (L.speak || '') + ' 秒') +
      metric('语速', r.speed || '—', '字/分钟', speedComment(r.speed)) +
      metric('口头禅', r.fillerTotal + ' 次', '') +
      metric('关键信息', r.hitCount + ' / ' + (L.must ? L.must.length : 3), '') +
      '</div>' +
      '<div class="card tight"><div class="tiny muted" style="margin-bottom:8px">自评</div><div class="chips">' +
      [['目标达成', r.self && r.self.goal], ['结构清楚', r.self && r.self.structure], ['表达流畅', r.self && r.self.fluent], ['状态自然', r.self && r.self.natural]].map(function (x) {
        return '<span class="chipx hit">' + x[0] + ' ' + (x[1] || 0) + '/5</span>';
      }).join('') + '</div></div>' +
      '<div class="card"><b style="font-size:13px">当时的转写</b><div class="transcript" style="margin-top:8px">' + (r.transcript ? esc(r.transcript) : '<span class="muted">（没有转写）</span>') + '</div></div>' +
      '<div class="sessfoot"><button class="btn ghost block" data-act="del-rec" data-id="' + r.id + '">删除这条记录</button></div></div>';
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'warm-next') { warmIdx = (warmIdx + 1) % WARMUPS.length; renderToday(); }
    else if (act === 'random') {
      var d = LESSONS[Math.floor(Math.random() * LESSONS.length)].day;
      location.hash = '#session/' + d;
    }
    else if (act === 'close') closeSession();
    else if (act === 'demo') { if (SS) speak(SS.lesson.demo); }
    else if (act === 'to-speak') toSpeak();
    else if (act === 'skip-prep') { stopTimers(); SS.phase = 'ready'; renderSession(); }
    else if (act === 'start-speak') startSpeak();
    else if (act === 'textmode') {
      stopTimers();
      SS.dur = 0;
      SS.step = 'result'; SS.phase = 'result';
      SS.result = analyze('', SS.dur, SS.lesson);
      renderSession();
    }
    else if (act === 'stop-speak') stopSpeak();
    else if (act === 'again') {
      var day = SS.day;
      cleanupSession();
      SS = null;
      startSession(day);
    }
    else if (act === 'save') saveRecord();
    else if (act === 'reanalyze') reanalyze();
    else if (act === 'rate') {
      var dim = el.getAttribute('data-dim'), val = +el.getAttribute('data-val');
      SS.self[dim] = (SS.self[dim] === val) ? 0 : val;
      var row = el.closest('.selfrow');
      $('.star', row).forEach(function (s) {
        s.classList.toggle('on', +s.getAttribute('data-val') <= SS.self[dim]);
      });
    }
    else if (act === 'open-rec') { location.hash = '#record/' + el.getAttribute('data-id'); }
    else if (act === 'close-rec') { go(lastTab || 'records'); }
    else if (act === 'del-rec') {
      S.records = S.records.filter(function (r) { return r.id !== el.getAttribute('data-id'); });
      save(); overlay.hidden = true; overlay.innerHTML = ''; renderRecords(); toast('已删除');
    }
    else if (act === 'export') {
      var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '开口练-备份-' + todayStr() + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    }
    else if (act === 'import') { var f = $('#importFile'); if (f) f.click(); }
    else if (act === 'reset') {
      if (confirm('会清空所有练习记录和分数，确定吗？')) {
        S = { records: [], createdAt: Date.now() };
        save(); renderTop('guide'); renderGuide(); toast('已清空');
      }
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'importFile') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var o = JSON.parse(reader.result);
          if (!o || !Array.isArray(o.records)) throw new Error('bad');
          S.records = o.records.concat(S.records);
          S.records.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
          save(); renderGuide(); toast('已导入 ' + o.records.length + ' 条记录');
        } catch (err) { toast('文件格式不对'); }
      };
      reader.readAsText(file);
    }
  });

  // 返回键/切后台时，若在录音则结束
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && SS && SS.phase === 'recording') stopSpeak();
  });

  /* ---------------- boot ---------------- */
  window.__analyze = analyze;   // 便于自动化检查评分逻辑
  if (!location.hash) location.hash = '#today';
  route();
})();

</script>
</body>
</html>
